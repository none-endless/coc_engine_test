llm:
  api_key: sk-c8ce7db131914189b362c6a07b4225e8
  model: qwen3.6-plus
  enable_reasoning: false
  temperature: 0.7
  max_tokens: 5012
  timeout: 30
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1

system:
  max_retry_count: 3
  retry_timeout_ms: 5000
  fallback_error: 系统繁忙，请稍后重试
  snapshot_interval: 10

agent:
  dm:
    memory_turns: 5
  npc:
    memory_turns: 15
    shortlog_turns: 30
    max_actions_per_turn: 3
    cooldown_turns: 0
  narrative:
    recent_turns: 5

storage:
  world:
    sqlite_path: world/world_snapshots.sqlite3
  narrative:
    sqlite_path: world/narrative_truth.sqlite3

description:
  add_interval: 10
